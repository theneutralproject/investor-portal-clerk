name: Playwright Tests
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libcairo2-dev \
          libpango1.0-dev \
          libjpeg-dev \
          libgif-dev \
          librsvg2-dev \
          pkg-config
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Chromium Browser
      run: npx playwright install chromium --with-deps
    - name: Run Playwright tests
      env:
          CI: true
          BASE_URL: "http://localhost:3000"
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_WEBHOOK_SECRET: ${{ secrets.CLERK_WEBHOOK_SECRET }}
          ADMIN_USER_ID: ${{ secrets.ADMIN_USER_ID }}
          FINIX_USERNAME: ${{ secrets.FINIX_USERNAME }}
          FINIX_PASSWORD: ${{ secrets.FINIX_PASSWORD }}
          FINIX_PLAID_LINK_TOKEN: ${{ secrets.FINIX_PLAID_LINK_TOKEN }}
          FINIX_BASE_URL: ${{ secrets.FINIX_BASE_URL }}
          FINIX_MERCHANT_ID_519: ${{ secrets.FINIX_MERCHANT_ID_519 }}
          FINIX_MERCHANT_ID_BAKERS: ${{ secrets.FINIX_MERCHANT_ID_BAKERS }}
          FINIX_MERCHANT_ID_EDISON: ${{ secrets.FINIX_MERCHANT_ID_EDISON }}
          HUBSPOT_ACCESS_TOKEN: ${{ secrets.HUBSPOT_ACCESS_TOKEN }}
          HUBSPOT_API_BASE_URL: ${{ secrets.HUBSPOT_API_BASE_URL }}
          HUBSPOT_PROJECT_DOC_ACCESSED_WEBHOOK: ${{ secrets.HUBSPOT_PROJECT_DOC_ACCESSED_WEBHOOK }}
          HUBSPOT_FINANCE_DOC_ACCESSED_WEBHOOK: ${{ secrets.HUBSPOT_FINANCE_DOC_ACCESSED_WEBHOOK }}
          HUBSPOT_OWNER_ID: ${{ secrets.HUBSPOT_OWNER_ID }}
          SUPABASE_STORAGE_URL: ${{ secrets.SUPABASE_STORAGE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_TAG_ID: ${{ secrets.GOOGLE_TAG_ID }}
          NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
          NEXT_PUBLIC_POSTHOG_HOST: ${{ secrets.NEXT_PUBLIC_POSTHOG_HOST }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          PRISMA_FIELD_ENCRYPTION_KEY: ${{ secrets.PRISMA_FIELD_ENCRYPTION_KEY }}
          E2E_CLERK_USER_USERNAME: ${{ secrets.E2E_CLERK_USER_USERNAME }}
          E2E_CLERK_USER_PASSWORD: ${{ secrets.E2E_CLERK_USER_PASSWORD }}
          E2E_CLERK_USER_VERIFY_CODE: ${{ secrets.E2E_CLERK_USER_VERIFY_CODE }}
          E2E_CLERK_USER_PHONE: ${{ secrets.E2E_CLERK_USER_PHONE }}
          TEST_USER_TOKEN: ${{ secrets.TEST_USER_TOKEN }}
          IRON_SESSION_PASSWORD: ${{ secrets.IRON_SESSION_PASSWORD }}
          DOCUSIGN_BASE_PATH: ${{ secrets.DOCUSIGN_BASE_PATH }}
          DOCUSIGN_USER_ID: ${{ secrets.DOCUSIGN_USER_ID }}
          DOCUSIGN_INTEGRATION_KEY: ${{ secrets.DOCUSIGN_INTEGRATION_KEY }}
          DOCUSIGN_API_ACCOUNT_ID: ${{ secrets.DOCUSIGN_API_ACCOUNT_ID }}
          DOCUSIGN_RSA_PRIVATE_KEY: ${{ secrets.DOCUSIGN_RSA_PRIVATE_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_OAUTH_URL: ${{ secrets.GOOGLE_OAUTH_URL }}
          GOOGLE_ACCESS_TOKEN_URL: ${{ secrets.GOOGLE_ACCESS_TOKEN_URL }}
          GOOGLE_TOKEN_INFO_URL: ${{ secrets.GOOGLE_TOKEN_INFO_URL }}
          GOOGLE_CALLBACK_URL_SUBDIRECTORY: ${{ secrets.GOOGLE_CALLBACK_URL_SUBDIRECTORY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}          
      run: DEBUG=pw:browser npx playwright test
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 10